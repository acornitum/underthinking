<!doctype html>
<html lang="en" data-theme="hazel">
	<head>
		<script>
			// Apply the saved theme before anything renders, so there's no flash.
			try {
				const theme = localStorage.getItem('theme');
				if (['dark', 'light', 'disc', 'hazel'].includes(theme))
					document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
		<!-- Link previews (Discord, iMessage, X, ...). The image is static/underthinkingthumbnail.png (1200×630). -->
		<!-- <meta name="description" content="(another) site for debate motions" /> -->
		<meta property="og:type" content="website" />
		<!-- <meta property="og:site_name" content="underthink.ing" /> -->
		<meta property="og:title" content="underthink.ing" />
		<!-- <meta property="og:description" content="(another) site for debate motions" /> -->
		<meta property="og:url" content="https://underthink.ing" />
		<meta property="og:image" content="https://underthink.ing/underthinkingthumbnail.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="underthink.ing: site for debate motions + recorded rounds + drills timer!!!" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
		<!-- Cloudflare Web Analytics -->
 		<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b53669d7b36f41e1bab09881a6ded755"}'></script>
		<!-- End Cloudflare Web Analytics -->
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
