<!doctype html>
<html lang="en" data-theme="hazel">
	<head>
		<script>
			// Apply the saved theme before anything renders, so there's no flash.
			try {
				const theme = localStorage.getItem('theme');
				if (['dark', 'light', 'disc', 'hazel'].includes(theme))
					document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Link previews (Discord, iMessage, X, ...). The image is static/underthinkpreview.png (1200×630). -->
		<meta name="description" content="(another) site for debate motions" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="underthink.ing" />
		<meta property="og:title" content="underthink.ing" />
		<meta property="og:description" content="(another) site for debate motions" />
		<meta property="og:url" content="https://underthink.ing" />
		<meta property="og:image" content="https://underthink.ing/underthinkpreview.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="underthink.ing: (another) site for debate motions" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
